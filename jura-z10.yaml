substitutions:
  # Machine setting values from the Z10 machine XML (EF545 <MACHINESETTINGS>), same order as the select options
  auto_off_values: '"0F", "1E", "213C", "2178", "21B4", "21F0", "22012C", "220168", "2201A4", "2201E0", "22021C"'
  units_values: '"220000", "220100"'
  # This Z10's regional language set differs from the XML (which has Italian/Spanish/Portuguese/Russian
  # on 04/06/07/08); measured on the machine 2026-10-27: 04 Croatian, 06 Romanian, 08 Finnish, 07 Bulgarian.
  language_values: '"01", "02", "03", "04", "05", "06", "07", "08", "09", "0A", "0B"'

esphome:
  name: jura-z10
  # Entity ids become jura_<name>, the same as AlexxIT's Bluetooth integration, so its history carries over
  friendly_name: Jura

# Speaks the dongle's encrypted @-protocol to the machine on the service port.
# Based on github://harryzz/jura-uart-esphome@23c76fff5361cdc38e3fb8707aeb32a00d69fefc (tested
# upstream on an S8 / EF536), patched for the Z10: @TR:37 after the handshake, re-handshake on @t0,
# strict reply matching with retries, machine settings, brew action.
external_components:
  - source: github://andrei-marinache/jura-wifi-dongle-esphome@main
    components: [jura_link]
  # Or from a local clone, with components/ copied next to this file:
  # - source:
  #     type: local
  #     path: components
  #   components: [jura_link]

# Original Jura WiFi Connect dongle (TOP-tronic TT237XX, ESP32-WROOM-32D).
# Pin mapping from github.com/Sebbeben/Jura-Smart-Connect-Wifi-pcb-3d-model.
esp32:
  board: esp32dev
  framework:
    type: esp-idf

# UART0 (GPIO1/3) is the programming header; the machine is on GPIO16/17
logger:

api:
  encryption:
    key: !secret api_key
  # The API is closed on purpose while the machine is off (see interval below): no reboot for that.
  reboot_timeout: 0s
  # esphome.jura_z10_brew: one 16-byte @TP: recipe as 32 hex chars, built by jura-z10-card.
  actions:
    - action: brew
      variables:
        recipe: string
      then:
        - lambda: 'id(coffee_link).brew_recipe(recipe);'

# Never sleeps (no durations). It only makes the device report deep sleep, so HA keeps the
# entities available with their last values after a graceful disconnect.
deep_sleep:

# The dongle loses power ~5 min after the machine is switched off (measured 2026-10-27).
# Switch-off sets status bit 47 "SwitchOff Delay active" (measured: power cut 5 min 3 s later).
# Keep reporting for 4 min of it, then say goodbye to HA (graceful disconnect) before the power
# goes. Switched on again in time: reboot.
interval:
  # Power-cut detection (optional, needs the 9k1 / 7k5 divider on GPIO34, see README section 4;
  # without it delete this block and the supply_5v sensor). Mains loss while the machine is on:
  # the 5 V sags before the ESP dies. Say goodbye to HA (graceful disconnect) in that window, so
  # the entities stay available. Arms only after 10 s of a healthy supply.
  - interval: 1ms
    then:
      - lambda: |-
          static bool armed = false, closed = false;
          static uint32_t good_since = 0;
          static uint8_t low = 0;
          const float v = id(supply_5v).sample() * 2.2133f;   // same divider factor as the sensor filter
          if (std::isnan(v)) return;
          if (v >= 4.8f) {
            low = 0;
            if (!good_since) good_since = millis();
            if (!armed && millis() - good_since >= 10000) { armed = true; ESP_LOGI("jura", "power-fail detection armed (%.2f V)", v); }
            if (closed && millis() - good_since >= 2000) { ESP_LOGW("jura", "supply is back, rebooting"); App.safe_reboot(); }
            return;
          }
          good_since = 0;
          if (!armed || closed) return;
          if (v < 4.6f && ++low >= 2) {
            api::global_api_server->on_shutdown();
            closed = true;
            ESP_LOGW("jura", "supply dropped to %.2f V: graceful disconnect", v);
          }
  - interval: 1s
    then:
      - lambda: |-
          static uint32_t off_since = 0;
          static bool api_closed = false;
          const bool off = id(coffee_link).alert(47).value_or(false);
          if (!off) {
            off_since = 0;
            if (api_closed) { ESP_LOGW("jura", "machine on again, rebooting"); App.safe_reboot(); }
            return;
          }
          if (api_closed) return;
          if (!off_since) off_since = millis();
          if (millis() - off_since >= 240000) {
            ESP_LOGW("jura", "machine off: graceful disconnect before the power goes");
            api::global_api_server->on_shutdown();
            api_closed = true;
          }

ota:
  - platform: esphome
    encryption:

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 0
  fast_connect: false
  power_save_mode: NONE
  reboot_timeout: 60min

web_server:

status_led:
  pin:
    number: GPIO2   # LED to GND through R1, active high
    ignore_strapping_warning: true

# Service port: 9600 8N1, both lines 5 V on the Z10. The dongle shifts them:
# GPIO17 drives a MOSFET shifter (gate on 3V3, 3V3 pull-up), GPIO16 reads
# through a divider. Neither inverts. Same pins as ESP-AT's default UART.
uart:
  id: jura_uart
  tx_pin: GPIO17   # -> machine RX (socket pos 4)
  rx_pin: GPIO16   # <- machine TX (socket pos 2)
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

jura_link:
  id: coffee_link
  uart_id: jura_uart
  update_interval: 60s
  auto_poll: true
  # Brewing from HA: the brew action above, called by card/jura-z10-card.js
  allow_brew: true
  # allow_lock: true     # panel lock switch
  response_timeout: 3s
  # Machine settings (P_Argument): hardness, auto off, units, language, display brightness
  settings: ["02", "13", "08", "09", "0A"]
  machine_type:
    name: "Machine Type"
  last_error:
    name: "Last Error"

# Machine settings. Writes go through write_setting() (panel lock + checksum + read-back).
number:
  - platform: template
    name: "Water Hardness"
    icon: mdi:water-opacity
    unit_of_measurement: "°dH"
    min_value: 1
    max_value: 30
    step: 1
    mode: box
    entity_category: config
    update_interval: 5s
    lambda: |-
      auto v = id(coffee_link).setting("02");
      if (!v) return {};
      return (float) (strtol(v->c_str(), nullptr, 16) & 0xFF);
    set_action:
      - lambda: |-
          char b[3]; snprintf(b, sizeof(b), "%02X", (int) x);
          id(coffee_link).write_setting("02", b);
  - platform: template
    name: "Display Brightness"
    icon: mdi:brightness-6
    unit_of_measurement: "%"
    min_value: 10
    max_value: 100
    step: 10
    entity_category: config
    update_interval: 5s
    lambda: |-
      auto v = id(coffee_link).setting("0A");
      if (!v) return {};
      return 10.0f * strtol(v->c_str(), nullptr, 16);
    set_action:
      - lambda: |-
          char b[3]; snprintf(b, sizeof(b), "%02X", (int) (x / 10));
          id(coffee_link).write_setting("0A", b);

select:
  - platform: template
    id: auto_off
    name: "Auto Off"
    icon: mdi:timer-off-outline
    entity_category: config
    options: ["15 min", "30 min", "1 h", "2 h", "3 h", "4 h", "5 h", "6 h", "7 h", "8 h", "9 h"]
    update_interval: 5s
    lambda: |-
      auto i = id(coffee_link).setting_index("13", {${auto_off_values}});
      if (!i) return {};
      return id(auto_off).at(*i);
    set_action:
      - lambda: |-
          static const std::vector<std::string> v{${auto_off_values}};
          auto i = id(auto_off).index_of(x);
          if (i) id(coffee_link).write_setting("13", v[*i]);
  - platform: template
    id: units
    name: "Units"
    icon: mdi:scale-balance
    entity_category: config
    options: ["ml", "oz"]
    update_interval: 5s
    lambda: |-
      auto i = id(coffee_link).setting_index("08", {${units_values}});
      if (!i) return {};
      return id(units).at(*i);
    set_action:
      - lambda: |-
          static const std::vector<std::string> v{${units_values}};
          auto i = id(units).index_of(x);
          if (i) id(coffee_link).write_setting("08", v[*i]);
  - platform: template
    id: language
    name: "Language"
    icon: mdi:translate
    entity_category: config
    options: ["German", "English", "French", "Croatian", "Dutch", "Romanian", "Bulgarian", "Finnish", "Swedish", "Polish", "Estonian"]
    update_interval: 5s
    lambda: |-
      auto i = id(coffee_link).setting_index("09", {${language_values}});
      if (!i) return {};
      return id(language).at(*i);
    set_action:
      - lambda: |-
          static const std::vector<std::string> v{${language_values}};
          auto i = id(language).index_of(x);
          if (i) id(coffee_link).write_setting("09", v[*i]);

# Debug: send one @-command by hand. Read commands only; never WE:
text:
  - platform: template
    name: "AT Command"
    entity_category: diagnostic
    mode: text
    optimistic: true
    min_length: 0
    max_length: 40
    on_value:
      - lambda: 'if (!x.empty()) id(coffee_link).query_at(x);'
  # Debug: hex answer to the machine's @T2 challenge, used from the next handshake
  - platform: template
    name: "T2 Reply"
    entity_category: diagnostic
    mode: text
    optimistic: true
    min_length: 2
    max_length: 32
    initial_value: "818000"
    on_value:
      - lambda: 'id(coffee_link).set_t2_reply(x);'

