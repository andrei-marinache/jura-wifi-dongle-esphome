    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      auto v = id(coffee_link).entity_value("progress");
      if (!v) return {};
      return (float) atof(v->c_str());

text_sensor:
  - platform: template
    name: "Status"
    icon: mdi:coffee-maker
    update_interval: 1s
    lambda: |-
      if (id(coffee_link).alert(47).value_or(false)) return {"off"};   // SwitchOff Delay active
      return id(coffee_link).entity_value("status");
  # ok / alert, as the Bluetooth integration's "Alerts" sensor
  - platform: template
    name: "Alerts"
    icon: mdi:alert
    update_interval: 2s
    lambda: |-
      auto v = id(coffee_link).entity_value("active_alerts");
      if (!v) return {};
      return {*v == "none" ? "ok" : "alert"};
  - platform: template
    name: "Active Alerts"
    icon: mdi:alert-circle-outline
    update_interval: 2s
    lambda: return id(coffee_link).entity_value("active_alerts");
  - platform: template
    name: "Progress State"
    icon: mdi:coffee-maker-outline
    update_interval: 1s
    lambda: return id(coffee_link).entity_value("progress_state");
  - platform: template
    name: "Progress Product"
    icon: mdi:coffee-outline
    update_interval: 1s
    lambda: return id(coffee_link).entity_value("progress_product");

button:
  - platform: restart
    name: "Restart"
  # Maintenance processes (<PROCESSES> in the Z10 XML; coffee rinse @TG:22 is what the
  # Bluetooth automation sent). The machine then guides the process on its display.
  - platform: template
    name: "Coffee Rinse"
    icon: mdi:coffee-maker-outline
    on_press:
      - lambda: 'id(coffee_link).query_at("@TG:22");'
  - platform: template
    name: "Cappu Rinse"
    icon: mdi:cup-water
    on_press:
      - lambda: 'id(coffee_link).query_at("@TG:23");'
  - platform: template
    name: "Cappu Clean"
    icon: mdi:spray-bottle
    on_press:
      - lambda: 'id(coffee_link).query_at("@TG:21");'
  - platform: template
    name: "Cleaning"
    icon: mdi:dishwasher
    on_press:
      - lambda: 'id(coffee_link).query_at("@TG:24");'
  - platform: template
    name: "Decalc"
    icon: mdi:water-off
    on_press:
      - lambda: 'id(coffee_link).query_at("@TG:25");'
  - platform: template
    name: "Filter Change"
    icon: mdi:filter-cog
    on_press:
      - lambda: 'id(coffee_link).query_at("@TG:26");'
  - platform: template
    name: "Empty System"
    icon: mdi:water-minus
    on_press:
      - lambda: 'id(coffee_link).query_at("@TG:28");'
  # Power off doubles as "press OK" on a prompt; @TG:03 cancels e.g. a running power-off.
  # Left out on purpose: @TG:30/31 (install/disconnect accessory) and @TG:32 (factory reset, no confirmation).
  - platform: template
    name: "OK or Power Off"
    icon: mdi:power
    on_press:
      - lambda: 'id(coffee_link).query_at("@TG:04");'
  - platform: template
    name: "Cancel"
    icon: mdi:cancel
    on_press:
      - lambda: 'id(coffee_link).query_at("@TG:03");'
  # Confirm the step the machine is waiting for (e.g. "Press Rinse"), or cancel the running step
  - platform: template
    name: "Confirm Step"
    icon: mdi:check-circle-outline
    on_press:
      - lambda: 'id(coffee_link).query_at("@TG:10");'
  - platform: template
    name: "Cancel Step"
    icon: mdi:close-circle-outline
    on_press:
      - lambda: 'id(coffee_link).query_at("@TG:FF");'
  - platform: template
    name: "Refresh"
    icon: mdi:refresh
    entity_category: diagnostic
    on_press:
      - lambda: 'id(coffee_link).poll_stats();'
  # Debug: the boot handshake runs before WiFi is up, so it never reaches the web log
  - platform: template
    name: "Handshake"
    entity_category: diagnostic
    on_press:
      - lambda: 'id(coffee_link).start_handshake();'
