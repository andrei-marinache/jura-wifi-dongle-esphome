sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
  # Machine 5 V, through 9k1 / 7k5 into GPIO34 (WROOM pin 6, ADC1: works with WiFi on).
  # Optional: delete together with the power-cut detection interval if the divider is not fitted.
  - platform: adc
    id: supply_5v
    name: "Supply Voltage"
    pin: GPIO34
    attenuation: 12db
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: 5s
    filters:
      - multiply: 2.2133   # (9k1 + 7k5) / 7k5
  # Per-type totals, same product grouping as the Bluetooth integration (inactive doubles included)
  - platform: template
    name: "Total Products"
    icon: mdi:coffee
    unit_of_measurement: "products"
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: 10s
    lambda: return id(coffee_link).product(0x00);
